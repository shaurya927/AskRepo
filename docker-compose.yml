services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: askrepo
      POSTGRES_PASSWORD: askrepo_dev
      POSTGRES_DB: askrepo
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U askrepo"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - backend/.env
    environment:
      DATABASE_URL: postgresql+asyncpg://askrepo:askrepo_dev@db:5432/askrepo
      TEMP_REPOSITORY_PATH: /app/tmp/repos
      VECTOR_INDEX_PATH: /app/tmp/indexes
    volumes:
      - app_tmp:/app/tmp
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
  app_tmp:
